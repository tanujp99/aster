<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#d5d9e2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2c2f3e" />
    <meta name="description" content="Stitch panoramas and Photo Spheres on your own device." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf" as="font" type="font/ttf" crossorigin />
    <title>Aster — panoramas & photo spheres</title>
    <!-- Theme before first paint, the portfolio's order: stored choice, then system, then light. -->
    <script>
      (function () { try {
        var s = localStorage.getItem('theme');
        var t = s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
